<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أميرتي 👑</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ffd700; 
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #020205 100%);
            color: white; font-family: 'Cairo', sans-serif;
            overflow-x: hidden; min-height: 100vh;
        }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* شاشة العداد */
        #countdown-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .timer-box { display: flex; gap: 20px; margin-top: 30px; }
        .time-unit { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,215,0,0.3); padding: 20px; border-radius: 15px; min-width: 80px; }
        .time-unit span { display: block; font-size: 2.5rem; font-weight: bold; color: var(--primary); font-family: 'Reem Kufi', sans-serif; }

        /* معرض الصور */
        #main-content { display: none; padding: 50px 20px; }
        .memory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        
        .memory-card {
            position: relative; height: 400px; border-radius: 20px; overflow: hidden;
            cursor: pointer; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--glass);
        }
        .memory-card:hover { transform: scale(1.05) rotate(2deg); z-index: 10; }
        .memory-card.locked img { filter: blur(25px) grayscale(100%); }
        .memory-card img { width: 100%; height: 100%; object-fit: cover; transition: 1s; }
        
        .lock-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* نظام الأسئلة */
        #quiz-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 500px; background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(20px); border: 2px solid var(--primary); border-radius: 30px;
            padding: 30px; z-index: 1000; text-align: center;
        }
        .option-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            background: var(--glass); border: 1px solid var(--primary); color: white;
            border-radius: 50px; cursor: pointer; transition: 0.3s; font-size: 1.1rem;
        }
        .option-btn:hover { background: var(--primary); color: black; }

        /* الرسالة النهائية */
        #final-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
        }
        .surprise-box { 
            padding: 40px; border: 2px solid var(--primary); border-radius: 30px; 
            background: rgba(0,0,0,0.8); text-align: center;
            animation: backInDown 2s; /* نزول احترافي */
        }
        .action-msg { 
            font-size: 3rem; color: #fff; text-shadow: 0 0 30px var(--primary); 
            font-weight: bold; margin-top: 20px; animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>
    <canvas id="stars-container"></canvas>

    <div id="countdown-screen">
        <h1 class="animate__animated animate__fadeInDown">باقي على أجمل يوم في السنة... ✨</h1>
        <div class="timer-box">
            <div class="time-unit"><span id="days">00</span>أيام</div>
            <div class="time-unit"><span id="hours">00</span>ساعة</div>
            <div class="time-unit"><span id="mins">00</span>دقيقة</div>
            <div class="time-unit"><span id="secs">00</span>ثانية</div>
        </div>
        <p style="margin-top: 20px; opacity: 0.7;">تجهزي للمفاجأة يا أغلى شهد ❤️</p>
    </div>

    <div id="main-content">
        <h1 style="text-align: center; margin-bottom: 50px; color: var(--primary);">تحدي ذكرياتنا ❤️</h1>
        <div class="memory-grid" id="grid"></div>
    </div>

    <div id="quiz-modal">
        <h2 id="question-text">السؤال؟</h2>
        <div id="options-container"></div>
    </div>

    <div id="final-overlay">
        <div class="surprise-box">
            <span style="font-size: 1.8rem; color: var(--primary);">خلصتي كل الذكريات يا قلبي! ❤️</span>
            <div class="action-msg">بصي من البلكونة يا شهودة! 🎈</div>
        </div>
    </div>

    <script>
        const targetDate = "2026-06-16T00:00:00";
        
        const memories = [
            { img: "70c4b6df-e946-4b53-b2e2-b5b44d194991.jpg", question: "لو وصفت حبي ليكي في كلمة واحدة تفتكري هختار إيه؟", options: ["أمان", "الجنة", "حياة"], correct: 0 },
            { img: "b02711a2-59c4-4af8-bfe2-c4c2930a63a4.jpg", question: "أول هدية جبتها لك كانت إيه؟", options: ["ورد", "شوكولاتة وبوكس رمضان", "تورتة أو كيكة"], correct: 1 },
            { img: "be919d10-769a-4a1c-a055-987ab036a261.jpg", question: "لو ربنا رزقنا ببنوتة قمر زيك تحبي نسميها إيه؟", options: ["حور", "مسك", "شهد"], correct: 2 },
            { img: "d6dd22c6-a103-4b3e-990d-83069404dec5.jpg", question: "تفتكري التاريخ اللي دبستني فيه بحبك كان يوم كام بالظبط؟", options: ["11-2", "19-2", "21-2"], correct: 1 },
            { img: "edfb60ca-651e-4783-93f0-bc77456d73dc.jpg", question: "مين أكتر واحد بيحب التاني في المجرة دي؟", options: ["أنا طبعاً", "إنتي", "إحنا الاتنين سوا"], correct: 2 },
            { img: "d7fdcd09-93e8-48df-a88d-49cab8e4329a.jpg", question: "إيه أكتر أكلة بنحب نأكلها مع بعض؟", options: ["بازوكا", "بريم (Primer)", "رشدي"], correct: 2 }
        ];

        let unlockedCount = 0;

        function startCountdown() {
            setInterval(() => {
                const diff = new Date(targetDate) - new Date();
                if (diff <= 0) return showContent();
                document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                document.getElementById('secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            }, 1000);
        }

        function showContent() {
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('bg-music').play().catch(() => {
                document.addEventListener('click', () => document.getElementById('bg-music').play(), {once: true});
            });
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            memories.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card locked animate__animated animate__zoomIn';
                card.innerHTML = `<img src="${m.img}"><div class="lock-overlay"><span style="font-size: 3rem;">🔒</span><p>اضغطي لفك القفل</p></div>`;
                card.onclick = () => openQuiz(i, card);
                grid.appendChild(card);
            });
        }

        function openQuiz(i, card) {
            if (card.classList.contains('unlocked')) return;
            const modal = document.getElementById('quiz-modal');
            const container = document.getElementById('options-container');
            document.getElementById('question-text').innerText = memories[i].question;
            container.innerHTML = '';
            modal.style.display = 'block';

            memories[i].options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (idx === memories[i].correct) {
                        card.classList.remove('locked');
                        card.classList.add('unlocked');
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                        modal.style.display = 'none';
                        unlockedCount++;
                        if(unlockedCount === memories.length) setTimeout(showFinalSurprise, 1500);
                    } else alert("حاولي تاني يا روحي ❌");
                };
                container.appendChild(btn);
            });
        }

        function showFinalSurprise() {
            document.getElementById('final-overlay').style.display = 'flex';
            var end = Date.now() + (15 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#ffffff'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        const canvas = document.getElementById('stars-container');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let stars = Array(200).fill().map(() => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.5 }));
        function drawStars() {
            ctx.clearRect(0,0, canvas.width, canvas.height); ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
                s.y += s.speed; if (s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(drawStars);
        }
        startCountdown(); drawStars();
    </script>
</body>
</html>
