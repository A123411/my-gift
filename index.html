<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لأغلى شهد ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #ffd700; --glass: rgba(255, 255, 255, 0.08); }
        * { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #02020a; color: white; font-family: 'Cairo', sans-serif; overflow-x: hidden; width: 100vw; height: 100vh; }
        #stars-container { position: fixed; inset: 0; z-index: -1; }
        
        /* العداد - الديزاين الأصلي */
        #countdown-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; text-align: center; padding-top: 15vh; }
        .hero-text { font-size: 1.8rem; color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.6); animation: pulseText 2.5s infinite ease-in-out; margin-bottom: 40px; font-weight: 700; }
        @keyframes pulseText { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.05); filter: brightness(1.3); } }
        .timer-container { position: relative; padding: 20px; border-radius: 30px; background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%); }
        .timer-box { display: flex; flex-direction: row-reverse; gap: 12px; justify-content: center; }
        .time-unit { background: var(--glass); border: 1px solid rgba(255,215,0,0.2); padding: 12px; border-radius: 18px; width: 78px; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .time-unit span { display: block; font-size: 1.8rem; font-weight: bold; color: var(--gold); line-height: 1.2; }
        .label { font-size: 0.75rem; margin-bottom: 5px; color: #ccc; }
        #custom-alert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(139, 0, 0, 0.9); color: white; padding: 15px 30px; border-radius: 50px; z-index: 5000; font-weight: bold; text-align: center; border: 1px solid var(--gold); box-shadow: 0 0 20px rgba(0,0,0,0.5); font-size: 1rem; }
        
        /* المحتوى - الديزاين الأصلي مبعثر */
        #main-content { display: none; min-height: 100vh; padding: 40px 15px; position: relative; }
        .scatter-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding-top: 20px; }
        .memory-card { width: 145px; height: 190px; background: white; padding: 6px; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: pointer; transition: 0.4s; position: relative; }
        .memory-card img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) blur(12px); }
        .memory-card.unlocked img { filter: none; transition: 0.5s; }
        .lock-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; z-index: 2; color: #333;}
        
        /* المفاجأة الكبرى - تعديل النزول ببطء وانيميشن احترافي */
        #final-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .surprise-box { padding: 40px; border: 2px solid var(--gold); border-radius: 30px; background: rgba(0,0,0,0.8); box-shadow: 0 0 50px rgba(255,215,0,0.3); max-width: 90%; }
        .final-msg { font-size: 1.8rem; color: var(--gold); margin-bottom: 25px; font-weight: bold; display: block; }
        .action-msg { font-size: 2.8rem; color: #fff; text-shadow: 0 0 25px #ffd700; font-weight: 700; animation: heartBeat 1.5s infinite; }
        
        /* انيميشن مخصص للنزول ببطء شديد واحترافية */
        .animate__slowDownIn { animation-name: slowDownIn; animation-duration: 3s; animation-timing-function: ease-out; }
        @keyframes slowDownIn { from { opacity: 0; transform: translate3d(0, -200px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }

        /* المودال - الديزاين الأصلي الأبيض */
        #quiz-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal-box { background: white; border: 2px solid var(--gold); padding: 25px; border-radius: 25px; width: 100%; max-width: 340px; text-align: center; color: black; box-shadow: 0 0 30px rgba(255,215,0,0.4); }
        .modal-box h3 { color: black; margin-bottom: 20px; font-weight: 700; }
        .option-btn { width: 100%; padding: 14px; margin: 10px 0; border-radius: 15px; border: 2px solid #ddd; background: #f9f9f9; color: black; font-size: 1rem; font-weight: bold; transition: 0.3s; }
        .option-btn:active { background: #eee; transform: scale(0.98); }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <canvas id="stars-container"></canvas>
    <div id="custom-alert" class="animate__animated">حاولي تاني يا شهودة ❌</div>

    <div id="countdown-screen">
        <div class="hero-text animate__animated animate__fadeInDown">أجمل يوم لـ "شهودة" قرب ✨</div>
        <div class="timer-container animate__animated animate__fadeIn">
            <div class="timer-box">
                <div class="time-unit" id="admin-trigger"><div class="label">أيام</div><span id="days">00</span></div>
                <div class="time-unit"><div class="label">ساعة</div><span id="hours">00</span></div>
                <div class="time-unit"><div class="label">دقيقة</div><span id="mins">00</span></div>
                <div class="time-unit"><div class="label">ثانية</div><span id="secs">00</span></div>
            </div>
        </div>
        <div class="animate__animated animate__fadeInUp" style="margin-top: 40px;">
            <p style="opacity: 0.8; font-size: 1.1rem; color: #eee;">تجهزي للمفاجأة يا أغلى شهدhttp://googleusercontent.com/generated_image_content/0
