<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لأغلى شهد ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #ffd700; --glass: rgba(255, 255, 255, 0.08); }
        * { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #02020a; color: white; font-family: 'Cairo', sans-serif; overflow-x: hidden; width: 100vw; height: 100vh; }
        #stars-container { position: fixed; inset: 0; z-index: -1; }
        #countdown-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; text-align: center; padding-top: 15vh; }
        .hero-text { font-size: 1.8rem; color: var(--gold); text-shadow: 0 0 15px rgba(255,215,0,0.6); animation: pulseText 2.5s infinite ease-in-out; margin-bottom: 40px; font-weight: 700; }
        @keyframes pulseText { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.05); filter: brightness(1.3); } }
        .timer-container { position: relative; padding: 20px; border-radius: 30px; background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%); }
        .timer-box { display: flex; flex-direction: row-reverse; gap: 12px; justify-content: center; }
        .time-unit { background: var(--glass); border: 1px solid rgba(255,215,0,0.2); padding: 12px; border-radius: 18px; width: 78px; backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .time-unit span { display: block; font-size: 1.8rem; font-weight: bold; color: var(--gold); line-height: 1.2; }
        .label { font-size: 0.75rem; margin-bottom: 5px; color: #ccc; }
        #custom-alert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(139, 0, 0, 0.9); color: white; padding: 15px 30px; border-radius: 50px; z-index: 5000; font-weight: bold; text-align: center; border: 1px solid var(--gold); box-shadow: 0 0 20px rgba(0,0,0,0.5); font-size: 1rem; }
        #main-content { display: none; min-height: 100vh; padding: 40px 15px; position: relative; }
        .scatter-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; padding-top: 20px; }
        .memory-card { width: 145px; height: 190px; background: white; padding: 6px; border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: pointer; transition: 0.4s; position: relative; }
        .memory-card img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) blur(12px); }
        .memory-card.unlocked img { filter: none; }
        .lock-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; z-index: 2; color: #333;}
        #quiz-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; padding: 20px; align-items: center; justify-content: center; }
        .modal-box { background: #0a0a15; border: 1px solid var(--gold); padding: 25px; border-radius: 25px; width: 100%; max-width: 340px; text-align: center; }
        .option-btn { width: 100%; padding: 14px; margin: 10px 0; border-radius: 15px; border: 1px solid var(--gold); background: rgba(255,215,0,0.05); color: white; font-size: 1rem; }
        #final-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        .final-btn { background: linear-gradient(135deg, #ffd700, #b8860b); color: black; border: none; padding: 18px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; box-shadow: 0 0 35px var(--gold); animation: pulseBtn 1.8s infinite; }
        @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <canvas id="stars-container"></canvas>
    <div id="custom-alert" class="animate__animated">حاولي تاني يا شهودة ❌</div>

    <div id="countdown-screen">
        <div class="hero-text animate__animated animate__fadeInDown">أجمل يوم لـ "شهودة" قرب ✨</div>
        <div class="timer-container animate__animated animate__fadeIn">
            <div class="timer-box">
                <div class="time-unit" id="admin-trigger"><div class="label">أيام</div><span id="days">00</span></div>
                <div class="time-unit"><div class="label">ساعة</div><span id="hours">00</span></div>
                <div class="time-unit"><div class="label">دقيقة</div><span id="mins">00</span></div>
                <div class="time-unit"><div class="label">ثانية</div><span id="secs">00</span></div>
            </div>
        </div>
        <div class="animate__animated animate__fadeInUp" style="margin-top: 40px;">
            <p style="opacity: 0.8; font-size: 1.1rem; color: #eee;">تجهزي للمفاجأة يا أغلى شهد..</p>
            <div style="color: var(--gold); font-size: 1.5rem; margin-top: 10px;">❤️</div>
        </div>
    </div>

    <div id="main-content">
        <h2 style="color: var(--gold); text-align: center; margin-bottom: 40px; font-weight: 700;">ذكرياتنا يا شهودة ❤️</h2>
        <div class="scatter-container" id="grid"></div>
    </div>

    <div id="final-overlay">
        <h2 style="color: var(--gold); margin-bottom: 30px; padding: 0 20px;">خلصتي كل الذكريات! 🎈</h2>
        <button class="final-btn" onclick="alert('بحبك يا أغلى شهد في الدنيا، كل سنة وانتي معايا!')">اضغطي هنا يا أغلى شهد ✨</button>
    </div>

    <div id="quiz-modal">
        <div class="modal-box animate__animated animate__zoomIn">
            <h3 id="question-text">السؤال؟</h3>
            <div id="options-container"></div>
        </div>
    </div>

    <script>
        const targetDate = "2026-06-16T00:00:00";
        
        const memories = [
            { img: "https://i.postimg.cc/pTGKxhf8/70c4b6df-e946-4b53-b2e2-b5b44d194991.jpg", question: "لو وصفت حبي ليكي في كلمة واحدة تفتكري هختار إيه؟", options: ["أمان", "الجنة", "حياة"], correct: 0 },
            { img: "https://i.postimg.cc/0y0fFNBf/edfb60ca-651e-4783-93f0-bc77456d73dc.jpg", question: "أول هدية جبتها لك كانت إيه؟", options: ["ورد", "شوكولاتة وبوكس رمضان", "تورتة أو كيكة"], correct: 1 },
            { img: "https://i.postimg.cc/ZqjdFBDP/be919d10-769a-4a1c-a055-987ab036a261.jpg", question: "لو ربنا رزقنا ببنوتة قمر زيك تحبي نسميها إيه؟", options: ["حور", "مسك", "شهد"], correct: 2 },
            { img: "https://i.postimg.cc/T1556k24/d6dd22c6-a103-4b3e-990d-83069404dec5.jpg", question: "تفتكري التاريخ اللي دبستني فيه بحبك كان يوم كام بالظبط؟", options: ["11-2", "19-2", "21-2"], correct: 1 },
            { img: "https://i.postimg.cc/05hcJFSd/d7fdcd09-93e8-48df-a88d-49cab8e4329a.jpg", question: "مين أكتر واحد بيحب التاني في المجرة دي؟", options: ["أنا طبعاً", "إنتي", "إحنا الاتنين سوا"], correct: 2 },
            { img: "https://i.postimg.cc/0y0fFNBf/edfb60ca-651e-4783-93f0-bc77456d73dc.jpg", question: "إيه أكتر أكلة بنحب نأكلها مع بعض؟", options: ["بازوكا", "بريم (Primer)", "رشدي"], correct: 2 }
        ];

        let unlockedCount = 0;
        let adminClicks = 0;
        document.getElementById('admin-trigger').onclick = () => { if(++adminClicks === 3) showContent(); };

        function showError() {
            const alertBox = document.getElementById('custom-alert');
            alertBox.style.display = 'block';
            alertBox.classList.remove('animate__fadeOut');
            alertBox.classList.add('animate__fadeIn', 'animate__shakeX');
            setTimeout(() => {
                alertBox.classList.remove('animate__fadeIn', 'animate__shakeX');
                alertBox.classList.add('animate__fadeOut');
                setTimeout(() => { alertBox.style.display = 'none'; }, 500);
            }, 1500);
        }

        async function checkTime() {
            try {
                const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Riyadh');
                const data = await res.json();
                startCountdown(new Date(targetDate), new Date(data.datetime));
            } catch (e) { startCountdown(new Date(targetDate), new Date()); }
        }

        function startCountdown(target, now) {
            let diff = target - now;
            if (diff <= 0) return showContent();
            setInterval(() => {
                diff -= 1000;
                if (diff <= 0) { location.reload(); return; }
                document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                document.getElementById('secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            }, 1000);
        }

        function showContent() {
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            const music = document.getElementById('bg-music');
            music.play().catch(() => {
                document.addEventListener('click', () => music.play(), {once: true});
            });
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            memories.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card animate__animated animate__zoomIn';
                card.style.transform = `rotate(${(Math.random() * 16) - 8}deg)`;
                card.innerHTML = `<img src="${m.img}"><div class="lock-icon" id="lock-${i}">🔒</div>`;
                card.onclick = () => openQuiz(i, card);
                grid.appendChild(card);
            });
        }

        function openQuiz(i, card) {
            if (card.classList.contains('unlocked')) return;
            const modal = document.getElementById('quiz-modal');
            const container = document.getElementById('options-container');
            modal.style.display = 'flex';
            document.getElementById('question-text').innerText = memories[i].question;
            container.innerHTML = '';
            
            memories[i].options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (idx === memories[i].correct) {
                        card.classList.add('unlocked');
                        document.getElementById(`lock-${i}`).style.display = 'none';
                        confetti({ particleCount: 100, spread: 60, origin: { y: 0.8 } });
                        modal.style.display = 'none';
                        unlockedCount++;
                        if(unlockedCount === memories.length) setTimeout(showFinalButton, 1000);
                    } else showError();
                };
                container.appendChild(btn);
            });
        }

        function showFinalButton() {
            document.body.style.overflow = 'hidden';
            document.getElementById('final-overlay').style.display = 'flex';
        }

        const canvas = document.getElementById('stars-container');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let stars = Array(150).fill().map(() => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 1.5, v: Math.random() * 0.5 }));
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "white";
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill(); s.y += s.v; if (s.y > canvas.height) s.y = 0; });
            requestAnimationFrame(draw);
        }
        checkTime(); draw();
    </script>
</body>
</html>
