<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى أغلى شهد في الدنيا 👑</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Reem+Kufi:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ffd700; --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; background: radial-gradient(circle at center, #1a1a2e 0%, #020205 100%); color: white; font-family: 'Cairo', sans-serif; overflow-x: hidden; min-height: 100vh; }
        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #countdown-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        
        /* تعديل الترتيب: الأيام شمال والثواني يمين */
        .timer-box { 
            display: flex; 
            flex-direction: row-reverse; /* دي اللي بتعكس الترتيب عشان الأيام تبقى شمال */
            gap: 15px; 
            margin-top: 30px; 
        }

        .time-unit { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,215,0,0.3); padding: 15px; border-radius: 15px; min-width: 70px; }
        .time-unit span { display: block; font-size: 2rem; color: var(--primary); font-family: 'Reem Kufi', sans-serif; }
        #main-content { display: none; padding: 40px 20px; }
        .memory-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .memory-card { position: relative; height: 450px; border-radius: 20px; overflow: hidden; cursor: pointer; transition: 0.4s; border: 1px solid var(--glass); }
        .memory-card:hover { transform: scale(1.03); box-shadow: 0 0 30px rgba(255,215,0,0.2); }
        .memory-card.locked img { filter: blur(30px) brightness(0.5); }
        .memory-card img { width: 100%; height: 100%; object-fit: cover; }
        .lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); }
        #quiz-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 450px; background: rgba(15, 15, 25, 0.98); backdrop-filter: blur(25px); border: 2px solid var(--primary); border-radius: 25px; padding: 25px; z-index: 1000; text-align: center; }
        .option-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; background: var(--glass); border: 1px solid var(--primary); color: white; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .option-btn:hover { background: var(--primary); color: black; font-weight: bold; }
        .hidden-message { position: absolute; bottom: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); width: 100%; padding: 20px; text-align: center; transform: translateY(100%); transition: 0.5s; font-size: 0.9rem; }
        .unlocked .hidden-message { transform: translateY(0); }
        .unlocked .lock-overlay { display: none; }
        .unlocked img { filter: blur(0) !important; }
    </style>
</head>
<body>
    <canvas id="stars-container"></canvas>
    <audio id="bg-music" loop></audio>

    <div id="countdown-screen">
        <h1 class="animate__animated animate__pulse animate__infinite">أجمل يوم لـ "شهودة" قرب ✨</h1>
        <div class="timer-box">
            <div class="time-unit" id="admin-trigger">أيام<span id="days">00</span></div>
            <div class="time-unit">ساعة<span id="hours">00</span></div>
            <div class="time-unit">دقيقة<span id="mins">00</span></div>
            <div class="time-unit">ثانية<span id="secs">00</span></div>
        </div>
        <p style="margin-top: 25px; font-size: 1.2rem; color: #eee;">انتظري المفاجأة يا أغلى شهد..</p>
    </div>

    <div id="main-content">
        <h1 style="text-align: center; margin-bottom: 40px; color: var(--primary);">تحدي ذكرياتنا يا شهودة ❤️</h1>
        <div class="memory-grid" id="grid"></div>
    </div>

    <div id="quiz-modal">
        <h3 id="question-text">السؤال؟</h3>
        <div id="options-container"></div>
    </div>

    <script>
        const targetDate = "2026-06-16T00:00:00"; 
        const songs = ["song1.mp3", "song2.mp3", "song3.mp3"]; 

        const memories = [
            { img: "img1.jpg", question: "أول كلمة قولتها لك في شاتنا؟", options: ["أهلاً", "يا شهد", "إزيك"], correct: 1, message: "كنت متردد بس طلعت أحلى كلمة!" },
            { img: "img2.jpg", question: "أكتر أكلة بنحب نطلبها؟", options: ["شاورما", "برجر", "بيتزا"], correct: 0, message: "أحلى شاورما معاكي يا شهودة" },
        ];

        // ميزة المطور: اضغط 3 مرات على كلمة أيام عشان تفتح الموقع وتجربه
        let clicks = 0;
        document.getElementById('admin-trigger').onclick = () => {
            clicks++;
            if(clicks === 3) {
                alert("أهلاً يا علي! جرب الموقع براحتك دلوقتي 😉");
                showContent();
            }
        };

        async function checkTime() {
            try {
                const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Riyadh');
                const data = await res.json();
                const now = new Date(data.datetime);
                const target = new Date(targetDate);
                if (now >= target) showContent(); else startCountdown(target, now);
            } catch (e) { startCountdown(new Date(targetDate), new Date()); }
        }

        function startCountdown(target, now) {
            let diff = target - now;
            const timer = setInterval(() => {
                diff -= 1000;
                if (diff <= 0) { clearInterval(timer); showContent(); }
                document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                document.getElementById('secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            }, 1000);
        }

        function showContent() {
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            const audio = document.getElementById('bg-music');
            audio.src = songs[Math.floor(Math.random() * songs.length)];
            audio.play().catch(() => console.log("User interaction required"));
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = ''; 
            memories.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card locked animate__animated animate__fadeInUp';
                card.innerHTML = `<img src="${m.img}"><div class="lock-overlay"><span>🔒</span><p>افتحي الذكرى</p></div><div class="hidden-message">${m.message}</div>`;
                card.onclick = () => openQuiz(i, card);
                grid.appendChild(card);
            });
        }

        function openQuiz(i, card) {
            if (card.classList.contains('unlocked')) return;
            const modal = document.getElementById('quiz-modal');
            const container = document.getElementById('options-container');
            document.getElementById('question-text').innerText = memories[i].question;
            container.innerHTML = '';
            modal.style.display = 'block';
            memories[i].options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (idx === memories[i].correct) {
                        card.classList.remove('locked'); card.classList.add('unlocked');
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ffd700', '#ff4d4d'] });
                        modal.style.display = 'none';
                    } else alert("حاولي تاني يا شهودة ❌");
                };
                container.appendChild(btn);
            });
        }

        const canvas = document.getElementById('stars-container');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let stars = Array(150).fill().map(() => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 }));
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "white";
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill(); s.y += 0.3; if (s.y > canvas.height) s.y = 0; });
            requestAnimationFrame(draw);
        }
        checkTime(); draw();
    </script>
</body>
</html>
