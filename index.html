<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لأغلى شهد ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #ffd700; --glass: rgba(255, 255, 255, 0.1); }
        * { touch-action: manipulation; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; background: #050510; color: white; 
            font-family: 'Cairo', sans-serif; overflow: hidden; 
            width: 100vw; height: 100vh; position: fixed;
        }

        #stars-container { position: fixed; inset: 0; z-index: -1; }

        /* شاشة البداية اللي طلبتها */
        #countdown-screen { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100%; text-align: center; padding: 20px;
        }

        .hero-text { 
            font-size: 1.8rem; color: var(--gold); 
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
            animation: pulseText 2s infinite ease-in-out; 
            margin-bottom: 30px;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .timer-box { display: flex; flex-direction: row-reverse; gap: 10px; }
        .time-unit { 
            background: var(--glass); border: 1px solid var(--gold); 
            padding: 10px; border-radius: 15px; width: 75px; 
            backdrop-filter: blur(5px);
        }
        .time-unit span { display: block; font-size: 1.6rem; font-weight: bold; color: var(--gold); }
        .label { font-size: 0.7rem; margin-bottom: 4px; }

        /* فكرة عرض الصور المبتكرة (المبعثرة) */
        #main-content { 
            display: none; height: 100%; overflow-y: auto; padding: 40px 10px; 
            perspective: 1000px;
        }

        .scatter-container { 
            position: relative; width: 100%; min-height: 800px; 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 40px;
        }

        .memory-card { 
            width: 160px; height: 220px; background: white; padding: 8px;
            border-radius: 5px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer; transition: 0.5s; position: relative;
        }

        /* زوايا عشوائية للصور */
        .card-1 { transform: rotate(-5deg); }
        .card-2 { transform: rotate(7deg); margin-top: 30px; }
        .card-3 { transform: rotate(-8deg); }
        .card-4 { transform: rotate(4deg); margin-top: -20px; }

        .memory-card img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) blur(5px); }
        .memory-card.unlocked img { filter: none; }
        
        .lock-icon { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2rem; color: #333; z-index: 2;
        }

        /* رسالة الخطأ (Neon في النص) */
        #custom-alert { 
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: rgba(255, 77, 77, 0.9);
            color: white; padding: 20px 40px; border-radius: 15px; 
            z-index: 3000; font-weight: bold; font-size: 1.2rem;
            box-shadow: 0 0 30px #ff4d4d; border: 2px solid white;
            text-align: center;
        }

        /* المودال */
        #quiz-modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 2000; padding: 30px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }
        .modal-box { 
            background: #151525; border: 2px solid var(--gold); 
            padding: 25px; border-radius: 25px; width: 100%; max-width: 400px;
        }
        .option-btn { 
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 50px;
            border: 1px solid var(--gold); background: transparent; color: white;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <canvas id="stars-container"></canvas>
    <div id="custom-alert" class="animate__animated">حاولي تاني يا شهودة ❌</div>

    <div id="countdown-screen">
        <div class="hero-text">أجمل يوم لـ "شهودة" قرب ✨</div>
        <div class="timer-box">
            <div class="time-unit" id="admin-trigger"><div class="label">أيام</div><span id="days">00</span></div>
            <div class="time-unit"><div class="label">ساعة</div><span id="hours">00</span></div>
            <div class="time-unit"><div class="label">دقيقة</div><span id="mins">00</span></div>
            <div class="time-unit"><div class="label">ثانية</div><span id="secs">00</span></div>
        </div>
        <p style="margin-top: 30px; opacity: 0.7;">تجهزي للمفاجأة يا أغلى شهد..</p>
    </div>

    <div id="main-content">
        <h2 style="color: var(--gold); margin-bottom: 50px; font-size: 1.8rem;">ذكرياتنا يا شهودة ❤️</h2>
        <div class="scatter-container" id="grid">
            </div>
    </div>

    <div id="quiz-modal" style="display: none;">
        <div class="modal-box animate__animated animate__zoomIn">
            <h3 id="question-text">السؤال؟</h3>
            <div id="options-container"></div>
        </div>
    </div>

    <script>
        const targetDate = "2026-06-16T00:00:00";
        const memories = [
            { id: 1, img: "img1.jpg", question: "أول كلمة قولتها لك في شاتنا؟", options: ["أهلاً", "يا شهد", "إزيك"], correct: 1 },
            { id: 2, img: "img2.jpg", question: "أكتر أكلة بنحب نطلبها؟", options: ["شاورما", "برجر", "بيتزا"], correct: 0 },
            { id: 3, img: "img3.jpg", question: "لون فستانك المفضل؟", options: ["أبيض", "أحمر", "أسود"], correct: 2 },
            { id: 4, img: "img4.jpg", question: "مين بيحب التاني أكتر؟", options: ["أنا طبعاً", "انتي", "إحنا الاتنين"], correct: 2 },
        ];

        let adminClicks = 0;
        document.getElementById('admin-trigger').onclick = () => { if(++adminClicks === 3) showContent(); };

        function showError() {
            const alertBox = document.getElementById('custom-alert');
            alertBox.style.display = 'block';
            alertBox.classList.add('animate__tada');
            setTimeout(() => { alertBox.style.display = 'none'; alertBox.classList.remove('animate__tada'); }, 2000);
        }

        async function checkTime() {
            try {
                const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Riyadh');
                const data = await res.json();
                startCountdown(new Date(targetDate), new Date(data.datetime));
            } catch (e) { startCountdown(new Date(targetDate), new Date()); }
        }

        function startCountdown(target, now) {
            let diff = target - now;
            if (diff <= 0) return showContent();
            const timer = setInterval(() => {
                diff -= 1000;
                if (diff <= 0) { clearInterval(timer); showContent(); }
                document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                document.getElementById('secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            }, 1000);
        }

        function showContent() {
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            memories.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = `memory-card card-${(i % 4) + 1} animate__animated animate__fadeIn`;
                card.innerHTML = `<img src="${m.img}"><div class="lock-icon" id="lock-${i}">🔒</div>`;
                card.onclick = () => openQuiz(i, card);
                grid.appendChild(card);
            });
        }

        function openQuiz(i, card) {
            if (card.classList.contains('unlocked')) return;
            const modal = document.getElementById('quiz-modal');
            const container = document.getElementById('options-container');
            modal.style.display = 'flex';
            document.getElementById('question-text').innerText = memories[i].question;
            container.innerHTML = '';
            
            memories[i].options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (idx === memories[i].correct) {
                        card.classList.add('unlocked');
                        document.getElementById(`lock-${i}`).style.display = 'none';
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
                        modal.style.display = 'none';
                    } else showError();
                };
                container.appendChild(btn);
            });
        }

        // نجوم الخلفية
        const canvas = document.getElementById('stars-container');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let stars = Array(120).fill().map(() => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 }));
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "white";
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill(); s.y += 0.25; if (s.y > canvas.height) s.y = 0; });
            requestAnimationFrame(draw);
        }
        checkTime(); draw();
    </script>
</body>
</html>
