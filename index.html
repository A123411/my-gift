<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إلى أغلى شهد في الدنيا 👑</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #ffd700; --glass: rgba(255, 255, 255, 0.1); }
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; background: #020205; color: white; font-family: 'Cairo', sans-serif; overflow-x: hidden; min-height: 100vh; position: fixed; width: 100%; height: 100%; }
        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        #countdown-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 20px; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; }

        .timer-box { display: flex; flex-direction: row-reverse; gap: 8px; justify-content: center; width: 100%; }
        .time-unit { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,215,0,0.3); padding: 10px; border-radius: 12px; flex: 1; max-width: 80px; }
        .time-unit span { display: block; font-size: 1.5rem; color: var(--primary); font-weight: bold; }
        .label { font-size: 0.7rem; opacity: 0.8; margin-bottom: 5px; }

        #main-content { display: none; height: 100%; overflow-y: auto; padding: 20px; text-align: center; }
        .memory-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding-bottom: 50px; }
        .memory-card { position: relative; height: 350px; border-radius: 20px; overflow: hidden; border: 1px solid var(--glass); }
        .memory-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .memory-card.locked img { filter: blur(20px) brightness(0.4); }
        .lock-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); }
        
        /* مودال الأسئلة الاحترافي */
        #quiz-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; background: rgba(15, 15, 25, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--primary); border-radius: 25px; padding: 20px; z-index: 1000; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .option-btn { width: 100%; padding: 12px; margin: 8px 0; background: var(--glass); border: 1px solid var(--primary); color: white; border-radius: 50px; font-size: 1rem; }

        /* رسالة الخطأ الشيك بدل الـ Alert */
        #custom-alert { display: none; position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: #ff4d4d; color: white; padding: 10px 20px; border-radius: 50px; z-index: 2000; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        .hidden-message { position: absolute; bottom: 0; width: 100%; padding: 15px; background: rgba(0,0,0,0.8); transform: translateY(100%); transition: 0.5s; font-size: 0.9rem; }
        .unlocked .hidden-message { transform: translateY(0); }
        .unlocked .lock-overlay { display: none; }
        .unlocked img { filter: blur(0) !important; }
    </style>
</head>
<body>
    <canvas id="stars-container"></canvas>
    <div id="custom-alert" class="animate__animated">حاولي تاني يا شهودة ❌</div>
    <audio id="bg-music" loop></audio>

    <div id="countdown-screen">
        <h1 class="animate__animated animate__fadeIn">أجمل يوم لـ "شهودة" قرب ✨</h1>
        <div class="timer-box">
            <div class="time-unit" id="admin-trigger"><div class="label">أيام</div><span id="days">00</span></div>
            <div class="time-unit"><div class="label">ساعة</div><span id="hours">00</span></div>
            <div class="time-unit"><div class="label">دقيقة</div><span id="mins">00</span></div>
            <div class="time-unit"><div class="label">ثانية</div><span id="secs">00</span></div>
        </div>
        <p style="margin-top: 20px; font-size: 0.9rem; opacity: 0.8;">انتظري المفاجأة يا أغلى شهد..</p>
    </div>

    <div id="main-content">
        <h2 style="color: var(--primary); margin-bottom: 30px;">تحدي ذكرياتنا ❤️</h2>
        <div class="memory-grid" id="grid"></div>
    </div>

    <div id="quiz-modal">
        <h3 id="question-text" style="margin-bottom: 20px;">السؤال؟</h3>
        <div id="options-container"></div>
    </div>

    <script>
        const targetDate = "2026-06-16T00:00:00";
        const memories = [
            { img: "img1.jpg", question: "أول كلمة قولتها لك في شاتنا؟", options: ["أهلاً", "يا شهد", "إزيك"], correct: 1, message: "كنت متردد بس طلعت أحلى كلمة!" },
            { img: "img2.jpg", question: "أكتر أكلة بنحب نطلبها؟", options: ["شاورما", "برجر", "بيتزا"], correct: 0, message: "أحلى شاورما معاكي يا شهودة" },
        ];

        let clicks = 0;
        document.getElementById('admin-trigger').onclick = () => { if(++clicks === 3) showContent(); };

        function showError() {
            const alertBox = document.getElementById('custom-alert');
            alertBox.style.display = 'block';
            alertBox.classList.add('animate__shakeX');
            setTimeout(() => { alertBox.classList.remove('animate__shakeX'); alertBox.style.display = 'none'; }, 2000);
        }

        async function checkTime() {
            try {
                const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Riyadh');
                const data = await res.json();
                startCountdown(new Date(targetDate), new Date(data.datetime));
            } catch (e) { startCountdown(new Date(targetDate), new Date()); }
        }

        function startCountdown(target, now) {
            let diff = target - now;
            if (diff <= 0) return showContent();
            const timer = setInterval(() => {
                diff -= 1000;
                if (diff <= 0) { clearInterval(timer); showContent(); }
                document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
                document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                document.getElementById('secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
            }, 1000);
        }

        function showContent() {
            document.getElementById('countdown-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            memories.forEach((m, i) => {
                const card = document.createElement('div');
                card.className = 'memory-card locked animate__animated animate__fadeInUp';
                card.innerHTML = `<img src="${m.img}"><div class="lock-overlay"><span>🔒</span><p>افتحي الذكرى</p></div><div class="hidden-message">${m.message}</div>`;
                card.onclick = () => openQuiz(i, card);
                grid.appendChild(card);
            });
        }

        function openQuiz(i, card) {
            if (card.classList.contains('unlocked')) return;
            const modal = document.getElementById('quiz-modal');
            const container = document.getElementById('options-container');
            document.getElementById('question-text').innerText = memories[i].question;
            container.innerHTML = '';
            modal.style.display = 'block';
            memories[i].options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    if (idx === memories[i].correct) {
                        card.classList.add('unlocked');
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } });
                        modal.style.display = 'none';
                    } else showError();
                };
                container.appendChild(btn);
            });
        }

        const canvas = document.getElementById('stars-container');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let stars = Array(100).fill().map(() => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, s: Math.random() * 2 }));
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "white";
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill(); s.y += 0.2; if (s.y > canvas.height) s.y = 0; });
            requestAnimationFrame(draw);
        }
        checkTime(); draw();
    </script>
</body>
</html>
